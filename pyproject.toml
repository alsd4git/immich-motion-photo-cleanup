[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "immich-motion-photo-cleanup"
version = "0.2.0"
description = "Audit and safely clean up redundant Immich Motion Photo videos"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
immich-motion-photo-cleanup = "immich_motion_photo_cleanup.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
immich_motion_photo_cleanup = ["*.sql"]

[dependency-groups]
dev = ["ruff==0.16.5"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Start with conventional correctness checks; introduce format enforcement
# separately after a deliberate, reviewed formatting pass.
select = ["E4", "E7", "E9", "F"]
