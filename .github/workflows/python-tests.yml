name: Python tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: python-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Ruff and syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.14"
          version: "0.10.0"
          enable-cache: true
      - name: Install locked development tools
        run: uv sync --locked --dev
      - name: Lint
        run: uv run ruff check .
      - name: Python syntax
        run: uv run python -m compileall -q .

  media-tests:
    name: Synthetic media (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: ${{ matrix.python-version }}
          version: "0.10.0"
          enable-cache: true
      - name: Install ExifTool and FFmpeg
        run: |
          apt_options=(-o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install -y --no-install-recommends libimage-exiftool-perl ffmpeg
      - name: Install locked development tools
        run: uv sync --locked --dev
      - name: Run unit and synthetic-media tests
        run: uv run python -m unittest discover -s . -p 'test_*.py' -v
